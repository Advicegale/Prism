[project]
name = "prism-pr-review"
version = "0.2.0"
description = "Local structural pull request review"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "graphifyy==0.9.86",
  "tree-sitter>=0.24,<1",
  "networkx>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
